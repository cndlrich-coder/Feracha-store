<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feracha Store | متجر فراشة</title>

    <!-- خط Cairo الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات FontAwesome المحدثة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="style.css">
    
    <!-- هيكل البيانات للذكاء الاصطناعي (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "Store",
      "name": "Feracha Store",
      "description": "متجر إلكتروني لبيع المنتجات المتنوعة مع توصيل مباشر واستلام الطلبات عبر الواتساب",
      "currenciesAccepted": "MAD",
      "paymentAccepted": "Cash on Delivery"
    }
    </script>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <span><i class="fa-solid fa-truck-fast"></i> التوصيل سريع والدفع عند الاستلام</span>
    </div>

    <!-- الهيدر -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-store"></i> Feracha Store
        </div>
        <p>تسوق أفضل المنتجات بكل سهولة وبأعلى جودة</p>
    </header>

    <!-- شريط المميزات -->
    <section class="features-bar">
        <div class="feature-item">
            <i class="fa-solid fa-shield-halved"></i>
            <div>
                <h4>جودة مضمونة</h4>
                <p>منتجات مختارة بعناية</p>
            </div>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-handshake"></i>
            <div>
                <h4>الدفع عند الاستلام</h4>
                <p>لا تدفع حتى تستلم</p>
            </div>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-headset"></i>
            <div>
                <h4>دعم متواصل</h4>
                <p>خدمة عملاء على الواتساب</p>
            </div>
        </div>
    </section>

    <!-- قسم المنتجات -->
    <main class="container">
        <h2 class="section-title">أحدث المنتجات</h2>
        <section class="products-grid" id="products-container">
            <!-- سيتم تحميل المنتجات عبر JavaScript -->
        </section>

        <!-- نافذة استمارة الطلب (Modal) -->
        <div id="order-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeOrderForm()">&times;</span>
                <div class="modal-header">
                    <i class="fa-brands fa-whatsapp whatsapp-icon"></i>
                    <h3>إكمال الطلب المباشر</h3>
                </div>
                <div id="modal-product-summary" class="product-summary"></div>
                
                <form id="whatsapp-form" onsubmit="sendToWhatsApp(event)">
                    <input type="hidden" id="selected-product">
                    <input type="hidden" id="selected-price">

                    <div class="input-group">
                        <label for="fullname"><i class="fa-solid fa-user"></i> الاسم الكامل:</label>
                        <input type="text" id="fullname" required placeholder="مثال: حسن محمد">
                    </div>

                    <div class="input-group">
                        <label for="phone"><i class="fa-solid fa-phone"></i> رقم الهاتف:</label>
                        <input type="tel" id="phone" required placeholder="06XXXXXXXX">
                    </div>

                    <div class="input-group">
                        <label for="city"><i class="fa-solid fa-location-dot"></i> المدينة والعنوان:</label>
                        <input type="text" id="city" required placeholder="مثال: الدار البيضاء، شارع...">
                    </div>

                    <div class="input-group">
                        <label for="quantity"><i class="fa-solid fa-cubes"></i> الكمية:</label>
                        <input type="number" id="quantity" value="1" min="1" required>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fa-brands fa-whatsapp"></i> تأكيد الطلب عبر الواتساب
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة © Feracha Store 2026</p>
    </footer>

    <script>
        // ضع رقمك على الواتساب هنا شامل رمز الدولة (مثال المغرب: 2126XXXXXXXX)
        const MY_PHONE_NUMBER = "212600000000"; 
        const CURRENCY = "درهم";

        const products = [
            {
                id: 1,
                title: "منتج أنيق نموذج 1",
                price: 199,
                description: "وصف مميز يوضح خامات المنتج وجودته العالية وأسباب اقتنائه.",
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: 2,
                title: "منتج مميز نموذج 2",
                price: 299,
                description: "تصميم عصري ومريح يناسب جميع الاستخدامات اليومية بأعلى المعايير.",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80"
            }
        ];

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="badge">الأكثر طلباً 🔥</div>
                    <div class="img-wrapper">
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-details">
                        <h3>${p.title}</h3>
                        <p class="desc">${p.description}</p>
                        <div class="price-row">
                            <span class="price">${p.price} <small>${CURRENCY}</small></span>
                        </div>
                        <button class="btn-buy" onclick="openOrderForm('${p.title}', ${p.price})">
                            <i class="fa-solid fa-cart-shopping"></i> اطلب الآن
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openOrderForm(title, price) {
            document.getElementById('selected-product').value = title;
            document.getElementById('selected-price').value = price;
            document.getElementById('modal-product-summary').innerHTML = `
                <span><strong>المنتج المطلوبة:</strong> ${title}</span><br>
                <span><strong>السعر:</strong> ${price} ${CURRENCY}</span>
            `;
            document.getElementById('order-modal').style.display = 'flex';
        }

        function closeOrderForm() {
            document.getElementById('order-modal').style.display = 'none';
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            const product = document.getElementById('selected-product').value;
            const price = document.getElementById('selected-price').value;
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const city = document.getElementById('city').value;
            const qty = document.getElementById('quantity').value;
            const total = price * qty;

            const message = `مرحباً Feracha Store 👋\nأرغب في تأكيد الطلب التالي:\n\n` +
                            `📦 *المنتج:* ${product}\n` +
                            `🔢 *الكمية:* ${qty}\n` +
                            `💰 *المجموع:* ${total} ${CURRENCY}\n\n` +
                            `👤 *الاسم:* ${name}\n` +
                            `📱 *الهاتف:* ${phone}\n` +
                            `📍 *العنوان والمدينة:* ${city}`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${MY_PHONE_NUMBER}?text=${encodedMessage}`, '_blank');
            closeOrderForm();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('order-modal');
            if (event.target == modal) {
                closeOrderForm();
            }
        }

        renderProducts();
    </script>
</body>
</html>
